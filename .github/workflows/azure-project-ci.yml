name: Validate Azure reliability project

on:
  push:
    paths:
      - "acc-project-azure/**"
      - ".github/workflows/azure-project-ci.yml"
  pull_request:
    paths:
      - "acc-project-azure/**"
      - ".github/workflows/azure-project-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test HTTP application
        working-directory: acc-project-azure/app
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t acc-healthcheck:ci ./acc-project-azure/app

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive acc-project-azure/terraform

      - name: Initialize Terraform providers
        working-directory: acc-project-azure/terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: acc-project-azure/terraform
        run: terraform validate
